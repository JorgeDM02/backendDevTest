spring:
  application:
    name: devtest

server:
  port: 5000

similar-products:
  downstream:
    base-url: http://localhost:3001
    connect-timeout: 500ms
    read-timeout: 500ms
  fan-out:
    max-concurrent-calls: 64
  cache:
    similar-ids-ttl: 5m
    product-detail-ttl: 30s
    maximum-size: 10000
  resilience:
    similar-ids:
      failure-rate-threshold: 50
      minimum-number-of-calls: 20
      sliding-window-size: 100
      wait-duration-in-open-state: 10s
    product-detail:
      failure-rate-threshold: 50
      minimum-number-of-calls: 20
      sliding-window-size: 100
      wait-duration-in-open-state: 10s
    retry:
      max-attempts: 2
      wait-duration: 50ms